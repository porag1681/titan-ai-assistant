<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITAN AI V2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:#02060b;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.container{
  width:92%;
  max-width:600px;
  text-align:center;
}

.orb{
  width:180px;
  height:180px;
  margin:auto;
  border:3px solid #00d9ff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 25px #00d9ff,0 0 80px #0066ff;
  animation:pulse 2s infinite;
}

.core{
  width:75px;
  height:75px;
  background:#00d9ff;
  border-radius:50%;
  box-shadow:0 0 30px #00d9ff,0 0 70px #0066ff;
}

@keyframes pulse{
  50%{transform:scale(1.08)}
}

h1{
  font-size:42px;
  letter-spacing:10px;
  margin:25px 0 5px;
}

#status{
  color:#70e7ff;
}

#mic{
  width:75px;
  height:75px;
  margin:20px;
  border-radius:50%;
  border:2px solid #00d9ff;
  background:#06131c;
  color:white;
  font-size:30px;
  cursor:pointer;
  box-shadow:0 0 25px #00d9ff;
}

#mic:active{
  transform:scale(.9);
}

.language button{
  padding:10px 20px;
  margin:5px;
  border-radius:8px;
  border:1px solid #00d9ff;
  background:#06131c;
  color:white;
}

.box{
  margin-top:12px;
  padding:15px;
  background:#061019;
  border:1px solid #12394a;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="orb">
    <div class="core"></div>
  </div>

  <h1>TITAN</h1>

  <p id="status">মাইক্রোফোন চাপুন এবং কথা বলুন</p>

  <div class="language">
    <button onclick="setLanguage('bn-BD')">বাংলা</button>
    <button onclick="setLanguage('en-US')">English</button>
  </div>

  <button id="mic" onclick="startListening()">🎤</button>

  <div class="box" id="userText">You: —</div>
  <div class="box" id="titanText">TITAN: —</div>

</div>

<script>

const statusText=document.getElementById("status");
const userText=document.getElementById("userText");
const titanText=document.getElementById("titanText");

let currentLanguage="bn-BD";

const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition=null;

if(SpeechRecognition){

  recognition=new SpeechRecognition();

  recognition.continuous=false;
  recognition.interimResults=false;

  recognition.onstart=function(){
    statusText.innerText="শুনছি...";
  };

  recognition.onresult=function(event){

    const command=
      event.results[0][0].transcript;

    userText.innerText="You: "+command;

    askTitan(command);
  };

  recognition.onerror=function(){
    statusText.innerText="Microphone error";
  };

  recognition.onend=function(){
    statusText.innerText="মাইক্রোফোন চাপুন এবং কথা বলুন";
  };

}else{

  statusText.innerText=
    "এই browser voice recognition support করে না।";
}


function setLanguage(language){

  currentLanguage=language;

  if(language==="bn-BD"){
    speak("বাংলা ভাষা চালু হয়েছে।");
  }else{
    speak("English language activated.");
  }
}


function startListening(){

  if(!recognition){
    alert("Your browser does not support voice recognition.");
    return;
  }

  recognition.lang=currentLanguage;

  recognition.start();
}


async function askTitan(message){

  statusText.innerText="TITAN চিন্তা করছে...";

  titanText.innerText="TITAN: চিন্তা করছি...";

  try{

    const response=await fetch(
      "https://titan-ai-assistant.vercel.app/api/chat",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:message
        })
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error || "API error");
    }

    const reply=data.reply;

    titanText.innerText="TITAN: "+reply;

    speak(reply);

  }catch(error){

    console.error(error);

    titanText.innerText=
      "TITAN: AI-এর সাথে সংযোগ করা যাচ্ছে না।";

    speak(
      currentLanguage==="bn-BD"
      ? "দুঃখিত, AI-এর সাথে সংযোগ করা যাচ্ছে না।"
      : "Sorry, I cannot connect to the AI."
    );
  }
}


function speak(message){

  speechSynthesis.cancel();

  const speech=
    new SpeechSynthesisUtterance(message);

  if(/[\u0980-\u09FF]/.test(message)){
    speech.lang="bn-BD";
  }else{
    speech.lang="en-US";
  }

  speech.rate=.95;
  speech.pitch=1;

  speechSynthesis.speak(speech);
}

</script>

</body>
</html>
