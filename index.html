<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TITAN AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  background:#02060b;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:92%;
  max-width:600px;
  padding:35px 20px;
  text-align:center;
  border:1px solid #18334a;
  border-radius:25px;
  background:#071019;
  box-shadow:0 0 40px #001a2b;
}

h1{
  font-size:48px;
  letter-spacing:8px;
  margin:10px 0;
}

#status{
  margin:20px 0;
  color:#00eaff;
  font-size:18px;
}

#heard{
  min-height:50px;
  margin:20px 0;
  color:#aaa;
}

button{
  border:0;
  border-radius:30px;
  padding:15px 28px;
  font-size:17px;
  background:#00d9ff;
  color:#001018;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
  <h1>TITAN</h1>

  <div id="status">Starting...</div>

  <div id="heard">
    Microphone চালু হচ্ছে...
  </div>

  <button onclick="startListening()">
    🎤 Start TITAN
  </button>
</div>

<script>

const API_URL = "/api/chat";

const statusBox = document.getElementById("status");
const heardBox = document.getElementById("heard");

let recognition = null;
let listening = false;
let active = false;

function isBangla(text){
  return /[\u0980-\u09FF]/.test(text);
}

function detectLanguage(text){
  return isBangla(text) ? "bn-BD" : "en-US";
}

/* SPEAK */

function speak(text){

  if(!("speechSynthesis" in window)){
    return;
  }

  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);

  u.lang = isBangla(text) ? "bn-BD" : "en-US";
  u.rate = 1;
  u.pitch = 1;

  speechSynthesis.speak(u);
}

/* SPEECH SETUP */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    statusBox.innerText =
      "❌ Voice support নেই";

    heardBox.innerText =
      "Chrome browser দিয়ে চেষ্টা করো";

    return;
  }

  recognition = new SpeechRecognition();

  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.lang = "en-US";

  recognition.onstart = function(){

    listening = true;

    statusBox.innerText =
      "🎤 Listening...";

    heardBox.innerText =
      "TITAN বলো...";
  };

  recognition.onresult = function(event){

    let finalText = "";
    let interimText = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      const text =
        event.results[i][0].transcript;

      if(event.results[i].isFinal){
        finalText += text;
      }else{
        interimText += text;
      }
    }

    heardBox.innerText =
      finalText || interimText;

    if(finalText){

      recognition.lang =
        detectLanguage(finalText);

      processVoice(finalText.trim());
    }
  };

  recognition.onerror = function(event){

    console.log("Speech error:",event.error);

    if(event.error === "not-allowed"){

      statusBox.innerText =
        "❌ Microphone blocked";

      heardBox.innerText =
        "Browser settings থেকে Microphone Allow করো";

      return;
    }

    statusBox.innerText =
      "⚠️ Voice error";

  };

  recognition.onend = function(){

    listening = false;

    if(window.titanListening){

      setTimeout(function(){

        try{
          recognition.start();
        }catch(e){}

      },700);
    }
  };
}

/* START */

function startListening(){

  if(!recognition){
    setupRecognition();
  }

  if(!recognition){
    return;
  }

  window.titanListening = true;

  active = false;

  try{

    recognition.start();

    statusBox.innerText =
      "🎤 Listening...";

  }catch(error){

    console.log(error);

  }
}

/* VOICE COMMAND */

function processVoice(text){

  const lower = text.toLowerCase();

  const titanWords =
    lower.includes("titan") ||
    lower.includes("tytan") ||
    lower.includes("টাইটান") ||
    lower.includes("টাইটেন") ||
    lower.includes("টাইটন");

  /* TITAN না বলা পর্যন্ত অপেক্ষা */

  if(!active){

    if(titanWords){

      active = true;

      statusBox.innerText =
        "🟢 TITAN Active";

      speak(
        isBangla(text)
        ? "জি, বলুন।"
        : "Yes, tell me."
      );
    }

    return;
  }

  /* TITAN */

  if(
    lower === "titan" ||
    lower === "tytan" ||
    lower === "টাইটান" ||
    lower === "টাইটেন" ||
    lower === "টাইটন"
  ){

    speak(
      isBangla(text)
      ? "জি, বলুন।"
      : "Yes, tell me."
    );

    return;
  }

  /* CREATOR */

  if(
    lower.includes("who created you") ||
    lower.includes("who is your creator") ||
    lower.includes("তোমাকে কে বানিয়েছে") ||
    lower.includes("তোমার creator কে") ||
    lower.includes("কে বানিয়েছে")
  ){

    const answer =
      isBangla(text)
      ? "আমার creator হলো Nur Nobi।"
      : "My creator is Nur Nobi.";

    heardBox.innerText = answer;
    speak(answer);

    return;
  }

  /* YOUTUBE */

  if(
    lower.includes("youtube") ||
    lower.includes("ইউটিউব")
  ){

    let query = text
      .replace(/titan/gi,"")
      .replace(/tytan/gi,"")
      .replace(/youtube/gi,"")
      .replace(/ইউটিউব/g,"")
      .replace(/search/gi,"")
      .replace(/খুঁজো/g,"")
      .replace(/সার্চ/g,"")
      .trim();

    if(!query){
      query = "trending videos";
    }

    window.open(
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(query),
      "_blank"
    );

    speak(
      isBangla(text)
      ? "ইউটিউবে সার্চ করছি।"
      : "Searching YouTube."
    );

    return;
  }

  /* GOOGLE */

  if(
    lower.includes("google") ||
    lower.includes("গুগল")
  ){

    let query = text
      .replace(/titan/gi,"")
      .replace(/google/gi,"")
      .replace(/গুগল/g,"")
      .replace(/search/gi,"")
      .replace(/খুঁজো/g,"")
      .replace(/সার্চ/g,"")
      .trim();

    if(!query){
      query = "Google";
    }

    window.open(
      "https://www.google.com/search?q=" +
      encodeURIComponent(query),
      "_blank"
    );

    speak(
      isBangla(text)
      ? "গুগলে সার্চ করছি।"
      : "Searching Google."
    );

    return;
  }

  /* AI */

  askAI(text);
}

/* AI */

async function askAI(message){

  statusBox.innerText =
    "🤖 TITAN thinking...";

  try{

    const response =
      await fetch(API_URL,{
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:message,
          language:detectLanguage(message)
        })
      });

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error || "AI request failed"
      );
    }

    const reply =
      data.reply ||
      "Sorry, I could not answer.";

    heardBox.innerText = reply;

    statusBox.innerText =
      "🟢 TITAN Active";

    speak(reply);

  }catch(error){

    console.error(error);

    statusBox.innerText =
      "❌ AI connection error";

    heardBox.innerText =
      "AI server-এর সাথে connection হচ্ছে না।";
  }
}

/* PAGE LOAD */

window.addEventListener("load",function(){

  setupRecognition();

  statusBox.innerText =
    "🎤 Start TITAN চাপো";

  heardBox.innerText =
    "প্রথমবার Start TITAN চাপতে হবে।";

});

</script>

</body>
</html>
